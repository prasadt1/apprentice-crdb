[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apprentice-crdb"
version = "0.1.0"
description = "An analyst agent that ships its own learning curve — replayable memory on CockroachDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "sqlglot>=25.0.0",
  "pydantic>=2.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
aws = ["boto3>=1.34"]
all = ["apprentice-crdb[dev,aws]"]

[project.scripts]
apprentice = "apprentice_crdb.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apprentice_crdb = ["sql/*.sql", "warehouse/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

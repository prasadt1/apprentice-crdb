<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Apprentice — YouTube cover (source of truth; render with rsvg-convert -w 1280).
       Mark: growth rings, read OUTWARD through time exactly like real rings.
       Four rings = the four AOST epochs in eval/RESULTS.md:
         t0 innermost  memory_zero         0 rules   <- accented: the epoch rewound to
         t1            filters             2 rules
         t2            revenue_and_fiscal  4 rules
         t3 outermost  join_path           5 rules
       The read head travels INWARD from now to t0 — what AS OF SYSTEM TIME does, and
       the demo's SECTION 5 beat (recall at t0 returns zero rules).
       Layout: type column x=200..790 so the left band is croppable; hero centred at
       x=1015; bottom-right left clear of YouTube's duration badge. Full bleed — no
       letterboxing, the artwork must fill all 1280x720. -->
  <defs>
    <radialGradient id="bg" cx="0.79" cy="0.5" r="0.72">
      <stop offset="0%" stop-color="#2b1d15"/>
      <stop offset="48%" stop-color="#151416"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#eb6834" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#eb6834" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#eb6834" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1015" cy="372" r="330" fill="url(#halo)"/>

  <!-- ── hero: growth rings ───────────────────────────────────────────── -->
  <g transform="translate(1015,372)">
    <!-- growth beyond the last epoch: suggestion only, not a countable ring -->
    <circle r="292" fill="none" stroke="#eb6834" stroke-width="26" opacity="0.05"/>
    <g fill="none" stroke="#eb6834">
      <circle r="252" stroke-width="1.8" opacity="0.34"/>
      <circle r="192" stroke-width="1.8" opacity="0.30"/>
      <circle r="130" stroke-width="1.8" opacity="0.26"/>
    </g>
    <!-- t0 — the epoch rewound to -->
    <circle r="72" fill="none" stroke="#eb6834" stroke-width="18" opacity="0.16"/>
    <circle r="72" fill="none" stroke="#eb6834" stroke-width="4.5" opacity="1"/>
    <!-- pith -->
    <circle r="7" fill="#eb6834" opacity="0.85"/>

    <!-- read head: travels inward from now to the queried timestamp -->
    <line x1="0" y1="-286" x2="0" y2="-72" stroke="#f6f4ef" stroke-width="1.4" opacity="0.26"/>
    <circle cy="-72" r="8.5" fill="#f6f4ef"/>

    <g font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#f6f4ef">
      <text x="18" y="-247" opacity="0.34">t3</text>
      <text x="18" y="-187" opacity="0.34">t2</text>
      <text x="18" y="-125" opacity="0.34">t1</text>
      <text x="20" y="-66" opacity="0.78" font-size="19">AS OF t0</text>
    </g>
  </g>

  <!-- ── brand lockup ─────────────────────────────────────────────────── -->
  <g transform="translate(226,150)">
    <circle r="26" fill="none" stroke="#eb6834" stroke-width="2" opacity="0.42"/>
    <circle r="16" fill="none" stroke="#eb6834" stroke-width="2.6" opacity="0.95"/>
    <circle r="5.5" fill="#eb6834"/>
    <line x1="0" y1="-31" x2="0" y2="31" stroke="#f6f4ef" stroke-width="1.3" opacity="0.42"/>
  </g>
  <text x="270" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="44"
        font-weight="700" letter-spacing="0.4" fill="#f6f4ef">Apprentice</text>

  <!-- ── tagline ──────────────────────────────────────────────────────── -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="-1.5">
    <text x="200" y="380" font-size="96" fill="#f6f4ef">Memory you</text>
    <text x="200" y="486" font-size="96" fill="#eb6834">can rewind.</text>
  </g>

  <!-- ── proof strip ──────────────────────────────────────────────────── -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="200" y="552" width="60" height="3" fill="#eb6834" opacity="0.85"/>
    <text x="200" y="606" font-size="26" font-weight="500" fill="#a8a5a0">Correct it once. Replay any answer,</text>
    <text x="200" y="642" font-size="26" font-weight="500" fill="#a8a5a0">at any point in its education.</text>
    <text x="200" y="684" font-size="20" font-weight="500" fill="#6e6c68" letter-spacing="1.6">COCKROACHDB × AWS · AGENTIC MEMORY</text>
  </g>
</svg>

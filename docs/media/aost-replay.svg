<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="800" fill="#fcfcfb"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="28" font-weight="700" fill="#0b0b0b">Replay is a timestamp  not a backup restore</text>
  <text x="60" y="84" font-size="17" fill="#52514e">Same cluster. Same exam. An earlier brain. BEGIN AS OF SYSTEM TIME &lt;hlc&gt;</text>

  <!-- timeline -->
  <line x1="80" y1="200" x2="1120" y2="200" stroke="#c3c2b7" stroke-width="2"/>

  <g>
    <circle cx="180" cy="200" r="10" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/>
    <text x="180" y="160" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">t0</text>
    <text x="180" y="236" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">memory_zero</text>
    <text x="180" y="256" font-size="12" fill="#52514e" text-anchor="middle">keys = []</text>
    <text x="180" y="276" font-size="12" fill="#898781" text-anchor="middle">ceiling 6  /  Lite 14</text>
  </g>
  <g>
    <circle cx="460" cy="200" r="10" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/>
    <text x="460" y="160" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">t1</text>
    <text x="460" y="236" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">filters</text>
    <text x="460" y="256" font-size="12" fill="#52514e" text-anchor="middle">2 filter keys</text>
    <text x="460" y="276" font-size="12" fill="#898781" text-anchor="middle">ceiling 7  /  Lite 19</text>
  </g>
  <g>
    <circle cx="740" cy="200" r="10" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/>
    <text x="740" y="160" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">t2</text>
    <text x="740" y="236" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">revenue + fiscal</text>
    <text x="740" y="256" font-size="12" fill="#52514e" text-anchor="middle">+ metric, calendar</text>
    <text x="740" y="276" font-size="12" fill="#898781" text-anchor="middle">ceiling 31  /  Lite 19</text>
  </g>
  <g>
    <circle cx="1020" cy="200" r="10" fill="#eb6834" stroke="#eb6834" stroke-width="3"/>
    <text x="1020" y="160" font-size="14" font-weight="700" fill="#eb6834" text-anchor="middle">t3</text>
    <text x="1020" y="236" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">join_path</text>
    <text x="1020" y="256" font-size="12" fill="#52514e" text-anchor="middle">all five house keys</text>
    <text x="1020" y="276" font-size="12" fill="#eb6834" text-anchor="middle">ceiling 44  /  Lite 16</text>
  </g>

  <rect x="60" y="320" width="520" height="280" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="88" y="356" font-size="13" font-weight="600" fill="#2a78d6" letter-spacing="0.6">NOW  t3</text>
  <text x="88" y="394" font-size="20" font-weight="700" fill="#0b0b0b">Live memory</text>
  <text x="88" y="428" font-size="15" fill="#52514e">filter:orders_soft_delete</text>
  <text x="88" y="452" font-size="15" fill="#52514e">filter:orders_not_cancelled</text>
  <text x="88" y="476" font-size="15" fill="#52514e">metric:revenue</text>
  <text x="88" y="500" font-size="15" fill="#52514e">calendar:fiscal</text>
  <text x="88" y="524" font-size="15" fill="#52514e">join:orders_customers_regions</text>
  <text x="88" y="560" font-size="14" fill="#52514e">Retrieval 44/44. Ceiling 44/50.</text>
  <text x="88" y="582" font-size="15" font-weight="700" fill="#eb6834">Micro 13  /  Lite 16  - already falling</text>

  <rect x="620" y="320" width="520" height="280" rx="12" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="648" y="356" font-size="13" font-weight="600" fill="#eb6834" letter-spacing="0.6">REWIND  t0</text>
  <text x="648" y="394" font-size="20" font-weight="700" fill="#0b0b0b">AS OF t0</text>
  <text x="648" y="428" font-size="15" fill="#52514e">BEGIN AS OF SYSTEM TIME</text>
  <text x="648" y="452" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">1786459251103416273</text>
  <text x="648" y="488" font-size="15" fill="#52514e">ORDER BY embedding &lt;-&gt; $1</text>
  <text x="648" y="512" font-size="15" fill="#52514e">LIMIT k</text>
  <text x="648" y="548" font-size="18" font-weight="700" fill="#eb6834">0 rules returned</text>
  <text x="648" y="576" font-size="15" fill="#52514e">because none existed yet</text>

  <path d="M580 460 L620 460" stroke="#eb6834" stroke-width="2.5" marker-end="url(#ar)"/>

  <text x="60" y="656" font-size="16" fill="#52514e">Closed-timestamp wait is real. I pin the txn at the HLC; I do not BEGIN at now and then time-travel.</text>
  <text x="60" y="688" font-size="16" fill="#52514e">Basic GC window is 75 minutes. Epochs are minutes apart. I disclose the compressed clock.</text>
  <text x="60" y="740" font-size="18" font-weight="700" fill="#0b0b0b">apprentice recall --as-of &lt;memory_zero HLC&gt;   /   keys = []</text>
</svg>

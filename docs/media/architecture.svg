<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="980" fill="#fcfcfb"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/>
    </marker>
    <marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
    </marker>
  </defs>

  <text x="60" y="36" font-size="24" font-weight="700" fill="#0b0b0b">How Apprentice is wired</text>
  <text x="60" y="58" font-size="14" fill="#52514e">The warehouse is a prop. CockroachDB is the brain. Bedrock generates. Replay is a timestamp.</text>

  <!-- BAND 0 · AGENT LOOP (lifecycle — for judges who are not agent-fluent) -->
  <rect x="48" y="72" width="1104" height="168" rx="12" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/>
  <text x="68" y="96" font-size="14" font-weight="700" fill="#eb6834" letter-spacing="0.4">0   /   THE AGENT LOOP</text>
  <text x="250" y="96" font-size="13" fill="#52514e">A human teaches · CockroachDB remembers and rewinds · Bedrock answers · the frozen exam decides</text>

  <!-- five phase boxes -->
  <rect x="68" y="112" width="196" height="78" rx="8" fill="#fbf6f2" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="84" y="134" font-size="13" font-weight="700" fill="#0b0b0b">TEACH</text>
  <text x="84" y="154" font-size="11" fill="#0b0b0b">reviewer corrects SQL</text>
  <text x="84" y="174" font-size="11" font-weight="600" fill="#eb6834">[human]</text>

  <path d="M264 151 L282 151" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="284" y="112" width="196" height="78" rx="8" fill="#fbf6f2" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="300" y="134" font-size="13" font-weight="700" fill="#0b0b0b">DISTILL</text>
  <text x="300" y="154" font-size="11" fill="#0b0b0b">AST-diff → rules</text>
  <text x="300" y="174" font-size="11" font-weight="600" fill="#52514e">[sqlglot · no LLM]</text>

  <path d="M480 151 L498 151" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="500" y="112" width="196" height="78" rx="8" fill="#fbf6f2" stroke="#eb6834" stroke-width="2"/>
  <text x="516" y="134" font-size="13" font-weight="700" fill="#0b0b0b">REMEMBER</text>
  <text x="516" y="154" font-size="11" fill="#0b0b0b">upsert · embed on write</text>
  <text x="516" y="174" font-size="11" font-weight="600" fill="#eb6834">[CockroachDB · Titan]</text>

  <path d="M696 151 L714 151" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="716" y="112" width="196" height="78" rx="8" fill="#fbf6f2" stroke="#eb6834" stroke-width="2"/>
  <text x="732" y="134" font-size="13" font-weight="700" fill="#0b0b0b">RECALL</text>
  <text x="732" y="154" font-size="11" fill="#0b0b0b">top-k · AS OF HLC</text>
  <text x="732" y="174" font-size="11" font-weight="600" fill="#eb6834">[CockroachDB]</text>

  <path d="M912 151 L930 151" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="932" y="112" width="196" height="78" rx="8" fill="#eef1f4" stroke="#5c6b7a" stroke-width="2"/>
  <text x="948" y="134" font-size="13" font-weight="700" fill="#0b0b0b">ANSWER</text>
  <text x="948" y="154" font-size="11" fill="#0b0b0b">Nova writes one SELECT</text>
  <text x="948" y="174" font-size="11" font-weight="600" fill="#5c6b7a">[Bedrock Converse]</text>

  <!-- PROVE bracket -->
  <path d="M68 204 L68 214 L1140 214 L1140 204" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <text x="600" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2a78d6">PROVE — frozen 50-question exam scores storage / recall / utilization separately  [the referee]</text>

  <!-- BAND 1 -->
  <rect x="48" y="252" width="1104" height="148" rx="12" fill="#eceae4" stroke="#898781" stroke-width="2"/>
  <text x="68" y="276" font-size="14" font-weight="700" fill="#0b0b0b" letter-spacing="0.4">1   /   HOW YOU INVOKE IT</text>
  <text x="300" y="276" font-size="13" font-weight="600" fill="#52514e">four doors into the same memory</text>

  <rect x="68" y="292" width="250" height="92" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
  <text x="86" y="322" font-size="15" font-weight="700" fill="#0b0b0b">CLI</text>
  <text x="86" y="348" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">apprentice educate / recall</text>
  <text x="86" y="368" font-size="11.5" fill="#52514e">the only write path</text>

  <rect x="338" y="292" width="250" height="92" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/>
  <text x="356" y="322" font-size="15" font-weight="700" fill="#0b0b0b">Frozen exam</text>
  <text x="356" y="348" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">run_exam.py questions</text>
  <text x="356" y="368" font-size="11.5" fill="#eb6834">agent sees id + question</text>

  <rect x="608" y="292" width="250" height="92" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
  <text x="626" y="322" font-size="15" font-weight="700" fill="#0b0b0b">Cloud MCP</text>
  <text x="626" y="348" font-size="11.5" fill="#52514e">Cursor inspects schema</text>
  <text x="626" y="368" font-size="11.5" fill="#52514e">read only, never writes</text>

  <rect x="878" y="292" width="250" height="92" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="896" y="322" font-size="15" font-weight="700" fill="#0b0b0b">Hosted demo</text>
  <text x="896" y="348" font-size="11.5" font-weight="700" fill="#2a78d6">AWS Lambda Function URL</text>
  <text x="896" y="368" font-size="11.5" fill="#52514e">judges run the loop live</text>

  <path d="M193 400 L193 422" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M463 400 L463 422" stroke="#eb6834" stroke-width="2.5" marker-end="url(#aro)"/>
  <path d="M733 400 L733 422" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M1003 400 L1003 422" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- BAND 2 CORE -->
  <rect x="48" y="424" width="1104" height="248" rx="12" fill="#fbf6f2" stroke="#eb6834" stroke-width="2.5"/>
  <text x="68" y="448" font-size="13" font-weight="700" fill="#eb6834" letter-spacing="0.4">2   /   COCKROACHDB MEMORY</text>
  <text x="280" y="448" font-size="13" fill="#0b0b0b">Basic  /  AWS eu-central-1  /  gc.ttlseconds = 4500  /  VECTOR(1024)</text>

  <rect x="68" y="464" width="250" height="188" rx="10" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="88" y="488" font-size="11" font-weight="700" fill="#52514e" letter-spacing="0.5">TEACH</text>
  <text x="88" y="512" font-size="15" font-weight="700" fill="#0b0b0b">sqlglot AST-diff</text>
  <text x="88" y="536" font-size="13" fill="#0b0b0b">naive vs correction</text>
  <text x="88" y="556" font-size="13" fill="#0b0b0b"> /  canonical rule keys</text>
  <text x="88" y="584" font-size="13" fill="#0b0b0b">episodic_events</text>
  <text x="88" y="604" font-size="13" fill="#0b0b0b">semantic_rules</text>
  <text x="88" y="632" font-size="13" font-weight="700" fill="#eb6834">SERIALIZABLE upsert</text>

  <rect x="338" y="464" width="250" height="188" rx="10" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="358" y="488" font-size="11" font-weight="700" fill="#52514e" letter-spacing="0.5">STORE</text>
  <text x="358" y="512" font-size="15" font-weight="700" fill="#0b0b0b">One live row / key</text>
  <text x="358" y="536" font-size="13" fill="#0b0b0b">superseded_by, not DELETE</text>
  <text x="358" y="556" font-size="13" fill="#0b0b0b">Titan embedding on write</text>
  <text x="358" y="584" font-size="13" fill="#0b0b0b">CREATE VECTOR INDEX</text>
  <text x="358" y="604" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">embedding &lt;-&gt; $1</text>
  <text x="358" y="632" font-size="13" font-weight="700" fill="#eb6834">index real / 5 rows / planner scans</text>

  <rect x="608" y="464" width="250" height="188" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/>
  <text x="628" y="488" font-size="11" font-weight="700" fill="#eb6834" letter-spacing="0.5">REWIND</text>
  <text x="628" y="512" font-size="15" font-weight="700" fill="#0b0b0b">AS OF SYSTEM TIME</text>
  <text x="628" y="536" font-size="13" fill="#0b0b0b">BEGIN at the HLC</text>
  <text x="628" y="556" font-size="13" fill="#0b0b0b">not AS OF on SELECT</text>
  <text x="628" y="584" font-size="13" fill="#0b0b0b">memory_zero  /  0 rows</text>
  <text x="628" y="604" font-size="13" fill="#0b0b0b">because none existed</text>
  <text x="628" y="632" font-size="13" font-weight="700" fill="#eb6834">not a Python filter</text>

  <rect x="878" y="464" width="250" height="188" rx="10" fill="#ffffff" stroke="#a8a59d" stroke-width="1.5"/>
  <text x="898" y="488" font-size="11" font-weight="700" fill="#52514e" letter-spacing="0.5">TWO CURVES</text>
  <text x="898" y="512" font-size="15" font-weight="700" fill="#0b0b0b">A  oracle ceiling</text>
  <text x="898" y="536" font-size="13" fill="#52514e">selector on live keys</text>
  <text x="898" y="564" font-size="15" font-weight="700" fill="#0b0b0b">B  Bedrock agent</text>
  <text x="898" y="588" font-size="13" fill="#52514e">Converse + retrieved</text>
  <text x="898" y="608" font-size="13" fill="#52514e">statements</text>
  <text x="898" y="632" font-size="13" font-weight="700" fill="#2a78d6">A  B is the finding</text>

  <!-- BAND 3 EDGES -->
  <rect x="48" y="696" width="1104" height="220" rx="12" fill="#eef1f4" stroke="#5c6b7a" stroke-width="2"/>
  <text x="68" y="720" font-size="13" font-weight="700" fill="#5c6b7a" letter-spacing="0.4">3   /   EDGES</text>
  <text x="160" y="720" font-size="13" fill="#0b0b0b">not the memory plane</text>

  <rect x="68" y="738" width="520" height="156" rx="10" fill="#ffffff" stroke="#5c6b7a" stroke-width="2"/>
  <text x="88" y="766" font-size="14" font-weight="700" fill="#0b0b0b">Amazon Bedrock   /   us-east-1</text>
  <text x="88" y="794" font-size="13" fill="#0b0b0b">Titan Text Embeddings V2    1024-d, on write and query</text>
  <text x="88" y="818" font-size="13" fill="#0b0b0b">Converse API    amazon.nova-micro-v1:0, temperature 0</text>
  <text x="88" y="842" font-size="13" fill="#0b0b0b">Model id is an env var. Call shape does not change.</text>
  <text x="88" y="866" font-size="13" font-weight="700" fill="#5c6b7a">Never sees gold / naive / bait / house_rules</text>
  <text x="88" y="886" font-size="13" font-weight="700" fill="#2a78d6">AWS Lambda runs this turn for the hosted demo</text>

  <rect x="612" y="738" width="516" height="156" rx="10" fill="#ffffff" stroke="#a8a59d" stroke-width="1.5"/>
  <text x="632" y="766" font-size="14" font-weight="700" fill="#0b0b0b">SQLite warehouse   /   local prop</text>
  <text x="632" y="794" font-size="13" fill="#0b0b0b">Six orders. Labels are hand-checkable.</text>
  <text x="632" y="818" font-size="13" fill="#0b0b0b">Fresh bootstrap per graded item.</text>
  <text x="632" y="842" font-size="13" fill="#0b0b0b">schema.sql is in the agent prompt.</text>
  <text x="632" y="874" font-size="13" font-weight="700" fill="#52514e">seed.sql is not.</text>

  <text x="60" y="950" font-size="14" fill="#52514e">CockroachDB Cloud on AWS is the memory plane. Amazon Bedrock generates; AWS Lambda executes the hosted turn. I will not call the cluster an AWS service I built.</text>
</svg>

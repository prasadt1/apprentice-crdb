<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="800" fill="#fcfcfb"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/>
    </marker>
    <marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
    </marker>
  </defs>

  <text x="60" y="36" font-size="24" font-weight="700" fill="#0b0b0b">How Apprentice is wired</text>
  <text x="60" y="58" font-size="14" fill="#52514e">The warehouse is a prop. CockroachDB is the brain. Bedrock generates. Replay is a timestamp.</text>

  <!-- BAND 1 -->
  <rect x="48" y="72" width="1104" height="148" rx="12" fill="#eceae4" stroke="#898781" stroke-width="2"/>
  <text x="68" y="96" font-size="14" font-weight="700" fill="#0b0b0b" letter-spacing="0.4">1   /   HOW YOU INVOKE IT</text>
  <text x="300" y="96" font-size="13" font-weight="600" fill="#52514e">two doors into the same memory</text>

  <rect x="68" y="112" width="340" height="92" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
  <rect x="86" y="128" width="22" height="18" rx="3" fill="none" stroke="#0b0b0b" stroke-width="1.5"/>
  <path d="M92 134 L98 137 L92 140" fill="none" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="118" y="142" font-size="15" font-weight="700" fill="#0b0b0b">CLI</text>
  <text x="86" y="174" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">apprentice educate  /  recall</text>
  <text x="86" y="190" font-size="12" fill="#52514e">writes stay here  not in the editor MCP</text>

  <rect x="428" y="112" width="340" height="92" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/>
  <text x="448" y="142" font-size="15" font-weight="700" fill="#0b0b0b">Frozen exam</text>
  <text x="448" y="166" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">eval/run_exam.py questions</text>
  <text x="448" y="186" font-size="12" fill="#eb6834">agent sees id + question only</text>

  <rect x="788" y="112" width="340" height="92" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
  <text x="808" y="142" font-size="15" font-weight="700" fill="#0b0b0b">Cloud MCP</text>
  <text x="808" y="166" font-size="12" fill="#52514e">Cursor inspects semantic_rules</text>
  <text x="808" y="186" font-size="12" fill="#52514e">read path  audit, not writes</text>

  <path d="M238 220 L238 242" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M598 220 L598 242" stroke="#eb6834" stroke-width="2.5" marker-end="url(#aro)"/>
  <path d="M958 220 L958 242" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- BAND 2 CORE -->
  <rect x="48" y="244" width="1104" height="248" rx="12" fill="#fbf6f2" stroke="#eb6834" stroke-width="2.5"/>
  <text x="68" y="268" font-size="13" font-weight="700" fill="#eb6834" letter-spacing="0.4">2   /   COCKROACHDB MEMORY</text>
  <text x="280" y="268" font-size="13" fill="#0b0b0b">Basic  /  AWS eu-central-1  /  gc.ttlseconds = 4500  /  VECTOR(1024)</text>

  <rect x="68" y="284" width="250" height="188" rx="10" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="88" y="308" font-size="11" font-weight="700" fill="#52514e" letter-spacing="0.5">TEACH</text>
  <text x="88" y="332" font-size="15" font-weight="700" fill="#0b0b0b">sqlglot AST-diff</text>
  <text x="88" y="356" font-size="13" fill="#0b0b0b">naive vs correction</text>
  <text x="88" y="376" font-size="13" fill="#0b0b0b"> /  canonical rule keys</text>
  <text x="88" y="404" font-size="13" fill="#0b0b0b">episodic_events</text>
  <text x="88" y="424" font-size="13" fill="#0b0b0b">semantic_rules</text>
  <text x="88" y="452" font-size="13" font-weight="700" fill="#eb6834">SERIALIZABLE upsert</text>

  <rect x="338" y="284" width="250" height="188" rx="10" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="358" y="308" font-size="11" font-weight="700" fill="#52514e" letter-spacing="0.5">STORE</text>
  <text x="358" y="332" font-size="15" font-weight="700" fill="#0b0b0b">One live row / key</text>
  <text x="358" y="356" font-size="13" fill="#0b0b0b">superseded_by, not DELETE</text>
  <text x="358" y="376" font-size="13" fill="#0b0b0b">Titan embedding on write</text>
  <text x="358" y="404" font-size="13" fill="#0b0b0b">CREATE VECTOR INDEX</text>
  <text x="358" y="424" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">embedding &lt;-&gt; $1</text>
  <text x="358" y="452" font-size="13" font-weight="700" fill="#eb6834">index is used, not claimed</text>

  <rect x="608" y="284" width="250" height="188" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/>
  <text x="628" y="308" font-size="11" font-weight="700" fill="#eb6834" letter-spacing="0.5">REWIND</text>
  <text x="628" y="332" font-size="15" font-weight="700" fill="#0b0b0b">AS OF SYSTEM TIME</text>
  <text x="628" y="356" font-size="13" fill="#0b0b0b">BEGIN at the HLC</text>
  <text x="628" y="376" font-size="13" fill="#0b0b0b">not AS OF on SELECT</text>
  <text x="628" y="404" font-size="13" fill="#0b0b0b">memory_zero  /  0 rows</text>
  <text x="628" y="424" font-size="13" fill="#0b0b0b">because none existed</text>
  <text x="628" y="452" font-size="13" font-weight="700" fill="#eb6834">not a Python filter</text>

  <rect x="878" y="284" width="250" height="188" rx="10" fill="#ffffff" stroke="#a8a59d" stroke-width="1.5"/>
  <text x="898" y="308" font-size="11" font-weight="700" fill="#52514e" letter-spacing="0.5">TWO CURVES</text>
  <text x="898" y="332" font-size="15" font-weight="700" fill="#0b0b0b">A  oracle ceiling</text>
  <text x="898" y="356" font-size="13" fill="#52514e">selector on live keys</text>
  <text x="898" y="384" font-size="15" font-weight="700" fill="#0b0b0b">B  Bedrock agent</text>
  <text x="898" y="408" font-size="13" fill="#52514e">Converse + retrieved</text>
  <text x="898" y="428" font-size="13" fill="#52514e">statements</text>
  <text x="898" y="452" font-size="13" font-weight="700" fill="#2a78d6">A  B is the finding</text>

  <!-- BAND 3 EDGES -->
  <rect x="48" y="516" width="1104" height="220" rx="12" fill="#eef1f4" stroke="#5c6b7a" stroke-width="2"/>
  <text x="68" y="540" font-size="13" font-weight="700" fill="#5c6b7a" letter-spacing="0.4">3   /   EDGES</text>
  <text x="160" y="540" font-size="13" fill="#0b0b0b">not the memory plane</text>

  <rect x="68" y="558" width="520" height="156" rx="10" fill="#ffffff" stroke="#5c6b7a" stroke-width="2"/>
  <text x="88" y="586" font-size="14" font-weight="700" fill="#0b0b0b">Amazon Bedrock   /   us-east-1</text>
  <text x="88" y="614" font-size="13" fill="#0b0b0b">Titan Text Embeddings V2    1024-d, on write and query</text>
  <text x="88" y="638" font-size="13" fill="#0b0b0b">Converse API    amazon.nova-micro-v1:0, temperature 0</text>
  <text x="88" y="662" font-size="13" fill="#0b0b0b">Model id is an env var. Call shape does not change.</text>
  <text x="88" y="694" font-size="13" font-weight="700" fill="#5c6b7a">Never sees gold / naive / bait / house_rules</text>

  <rect x="612" y="558" width="516" height="156" rx="10" fill="#ffffff" stroke="#a8a59d" stroke-width="1.5"/>
  <text x="632" y="586" font-size="14" font-weight="700" fill="#0b0b0b">SQLite warehouse   /   local prop</text>
  <text x="632" y="614" font-size="13" fill="#0b0b0b">Six orders. Labels are hand-checkable.</text>
  <text x="632" y="638" font-size="13" fill="#0b0b0b">Fresh bootstrap per graded item.</text>
  <text x="632" y="662" font-size="13" fill="#0b0b0b">schema.sql is in the agent prompt.</text>
  <text x="632" y="694" font-size="13" font-weight="700" fill="#52514e">seed.sql is not.</text>

  <text x="60" y="770" font-size="14" fill="#52514e">CockroachDB Cloud on AWS is the memory plane. Bedrock is the generator. I will not call the cluster an AWS service I built.</text>
</svg>

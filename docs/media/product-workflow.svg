<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="800" fill="#fcfcfb"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="28" font-weight="700" fill="#0b0b0b">The full loop  not only a chat that got longer</text>
  <text x="60" y="84" font-size="17" fill="#52514e">Teach, store, rewind, answer, grade. Same frozen labels at every epoch.</text>

  <rect x="60" y="118" width="160" height="280" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="80" y="152" font-size="12" font-weight="600" fill="#898781" letter-spacing="0.6">1  TEACH</text>
  <text x="80" y="186" font-size="18" font-weight="700" fill="#0b0b0b">Correction</text>
  <text x="80" y="220" font-size="14" fill="#52514e">Wrong attempt +</text>
  <text x="80" y="242" font-size="14" fill="#52514e">gold pair go into</text>
  <text x="80" y="264" font-size="14" fill="#52514e">episodic_events.</text>
  <text x="80" y="300" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">q08 q11</text>
  <text x="80" y="322" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">q01 q02</text>
  <text x="80" y="344" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">q06</text>
  <text x="80" y="376" font-size="13" fill="#52514e">Curriculum, not</text>
  <text x="80" y="396" font-size="13" fill="#52514e">the whole exam.</text>

  <path d="M228 258 L252 258" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="260" y="118" width="160" height="280" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="280" y="152" font-size="12" font-weight="600" fill="#898781" letter-spacing="0.6">2  DISTILL</text>
  <text x="280" y="186" font-size="18" font-weight="700" fill="#0b0b0b">AST-diff</text>
  <text x="280" y="220" font-size="14" fill="#52514e">sqlglot. Date</text>
  <text x="280" y="242" font-size="14" fill="#52514e">windows  /  fiscal.</text>
  <text x="280" y="264" font-size="14" fill="#52514e">Customer join  / </text>
  <text x="280" y="286" font-size="14" fill="#52514e">canonical key.</text>
  <text x="280" y="322" font-size="13" fill="#52514e">No LLM in this</text>
  <text x="280" y="344" font-size="13" fill="#52514e">path. The diff</text>
  <text x="280" y="366" font-size="13" fill="#52514e">is the evidence.</text>

  <path d="M428 258 L452 258" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="460" y="118" width="160" height="280" rx="12" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="480" y="152" font-size="12" font-weight="600" fill="#eb6834" letter-spacing="0.6">3  STORE</text>
  <text x="480" y="186" font-size="18" font-weight="700" fill="#0b0b0b">CockroachDB</text>
  <text x="480" y="220" font-size="14" fill="#52514e">semantic_rules</text>
  <text x="480" y="242" font-size="14" fill="#52514e">+ Titan vector</text>
  <text x="480" y="264" font-size="14" fill="#52514e">+ vector index</text>
  <text x="480" y="300" font-size="14" fill="#52514e">One live row</text>
  <text x="480" y="322" font-size="14" fill="#52514e">per key. Old</text>
  <text x="480" y="344" font-size="14" fill="#52514e">row superseded.</text>

  <path d="M628 258 L652 258" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="660" y="118" width="160" height="280" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="680" y="152" font-size="12" font-weight="600" fill="#2a78d6" letter-spacing="0.6">4  REWIND</text>
  <text x="680" y="186" font-size="18" font-weight="700" fill="#0b0b0b">AOST + kNN</text>
  <text x="680" y="220" font-size="14" fill="#52514e">BEGIN AS OF</text>
  <text x="680" y="242" font-size="14" fill="#52514e">SYSTEM TIME</text>
  <text x="680" y="278" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">embedding &lt;-&gt;</text>
  <text x="680" y="314" font-size="14" fill="#52514e">t0 returns 0</text>
  <text x="680" y="336" font-size="14" fill="#52514e">rules. Honest</text>
  <text x="680" y="358" font-size="14" fill="#52514e">empty memory.</text>

  <path d="M828 258 L852 258" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="860" y="118" width="160" height="280" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="880" y="152" font-size="12" font-weight="600" fill="#898781" letter-spacing="0.6">5  ANSWER</text>
  <text x="880" y="186" font-size="18" font-weight="700" fill="#0b0b0b">A or B</text>
  <text x="880" y="220" font-size="14" fill="#52514e">A  /  oracle</text>
  <text x="880" y="242" font-size="14" fill="#52514e">selector ceiling</text>
  <text x="880" y="274" font-size="14" fill="#52514e">B  /  Bedrock</text>
  <text x="880" y="296" font-size="14" fill="#52514e">Converse, T=0</text>
  <text x="880" y="332" font-size="14" fill="#52514e">{id, question}</text>
  <text x="880" y="354" font-size="14" fill="#52514e">+ DDL + rules</text>

  <path d="M1028 258 L1052 258" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="1060" y="118" width="100" height="280" rx="12" fill="#ffffff" stroke="#0ca30c" stroke-width="2"/>
  <text x="1074" y="152" font-size="12" font-weight="600" fill="#0ca30c" letter-spacing="0.6">6</text>
  <text x="1074" y="186" font-size="16" font-weight="700" fill="#0b0b0b">Grade</text>
  <text x="1074" y="220" font-size="13" fill="#52514e">result</text>
  <text x="1074" y="240" font-size="13" fill="#52514e">signature</text>
  <text x="1074" y="276" font-size="13" fill="#52514e">vs frozen</text>
  <text x="1074" y="296" font-size="13" fill="#52514e">labels</text>
  <text x="1074" y="336" font-size="13" font-weight="700" fill="#0b0b0b">reject</text>
  <text x="1074" y="356" font-size="13" fill="#52514e">= wrong</text>

  <rect x="60" y="430" width="1080" height="280" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="88" y="468" font-size="13" font-weight="600" fill="#898781" letter-spacing="0.6">WHAT I REFUSE</text>
  <text x="88" y="508" font-size="18" font-weight="700" fill="#0b0b0b">I do not tune against the frozen labels. I do not edit a label to chase a score.</text>
  <text x="88" y="546" font-size="16" fill="#52514e">The generator never reads gold_sql, naive_sql, bait_sql, house_rules.py, or seed.sql.</text>
  <text x="88" y="578" font-size="16" fill="#52514e">Malformed SQL is wrong, not skipped. memory_zero is empty via AOST, not via an if-epoch==0.</text>
  <text x="88" y="622" font-size="16" fill="#52514e">44/50 is the oracle ceiling. Curve B is what a real model does with the same memory.</text>
  <text x="88" y="668" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">apprentice educate --policy both</text>
</svg>

  <text x="88" y="616" font-size="13" font-weight="600" fill="#eb6834" letter-spacing="0.6">THE THIRD LEG</text>
  <text x="88" y="650" font-size="17" font-weight="700" fill="#0b0b0b">At join_path, retrieval is 44/44. The oracle scores 88%. Both agents are falling.</text>
  <text x="88" y="682" font-size="15" fill="#52514e">Storage worked. Recall worked. Utilization did not. k=5 with five rules injects the whole corpus - including on items that need none.</text>
  <text x="88" y="710" font-size="15" fill="#52514e">Lite is better cold (14 vs 8) and still ends below its own peak. Not one weak model.</text>
  <text x="88" y="738" font-size="14" fill="#52514e">Source: eval/RESULTS.md  /  labels frozen at b043aea  /  temperature=0</text>
